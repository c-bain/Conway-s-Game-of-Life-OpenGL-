<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life - WebGL</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .controls {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls h3 {
            margin-top: 0;
            color: #555;
        }

        .control-item {
            display: flex;
            align-items: center;
            margin: 10px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
        }

        .key {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            margin-right: 15px;
            min-width: 30px;
            text-align: center;
        }

        .description {
            color: #666;
        }

        #canvas {
            display: block;
            margin: 20px auto;
            border: 3px solid #667eea;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #output {
            background: #2d3748;
            color: #48bb78;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Conway's Game of Life</h1>
        
        <div class="controls">
            <h3>Controls:</h3>
            <div class="control-item">
                <span class="key">C</span>
                <span class="description">Clear the grid</span>
            </div>
            <div class="control-item">
                <span class="key">R</span>
                <span class="description">Refresh and randomize the grid</span>
            </div>
            <div class="control-item">
                <span class="key">P</span>
                <span class="description">Pause/Resume the simulation</span>
            </div>
            <div class="control-item">
                <span class="key">S</span>
                <span class="description">Cycle through speed levels (Normal → Slower → Slower → Slower → Normal)</span>
            </div>
            <div class="control-item">
                <span class="key">🖱️</span>
                <span class="description">Click on the grid to toggle cells</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading Conway's Game of Life...</p>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
        
        <div id="output"></div>
    </div>

    <div class="footer">
        <p>Conway's Game of Life - WebGL Edition</p>
    </div>

    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                var element = document.getElementById('output');
                if (element) element.innerHTML = ''; // clear browser cache
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log(text);
                    if (element) {
                        element.innerHTML += text + "\n";
                        element.scrollTop = element.scrollHeight; // focus on bottom
                    }
                };
            })(),
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            onRuntimeInitialized: function() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('canvas').style.display = 'block';
            }
        };
    </script>
    <script async type="text/javascript" src="conway.js"></script>
</body>
</html>
